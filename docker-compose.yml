version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: bandvault_postgres
    environment:
      POSTGRES_USER: bandvault_user
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: bandvault_db
    ports:
     - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bandvault_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bandvault_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
volumes:
  pgdata:
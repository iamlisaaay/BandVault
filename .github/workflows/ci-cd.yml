# ============================================
# C3: CI/CD - збірка, тести та автоматичне розгортання після оновлення main
#   1) build-test: unit + інтеграційні тести (QA3) та E2E на Playwright (QA2) з PostgreSQL
#   2) docker:     образ публікується в GitHub Container Registry
#   3) deploy:     розгортання на Render (C2) через Deploy Hook
#   4) functions:  розгортання Azure Functions (B7), якщо налаштовано секрет
# Секрети репозиторію: RENDER_DEPLOY_HOOK_URL, RENDER_APP_URL (необов'язково),
#                      AZURE_FUNCTIONAPP_NAME + AZURE_FUNCTIONAPP_PUBLISH_PROFILE (необов'язково)
# ============================================
name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bandvault_user
          POSTGRES_PASSWORD: SecretPassword123!
          POSTGRES_DB: bandvault_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bandvault_user -d bandvault_db"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BandVault.slnx

      - name: Build
        run: dotnet build BandVault.slnx -c Release --no-restore

      - name: Unit & auth tests (QA3)
        run: dotnet test BandVault.Tests -c Release --no-build --logger trx --results-directory TestResults

      - name: Install Playwright browser
        run: pwsh BandVault.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E tests (QA2)
        env:
          E2E_BROWSER: chromium
          E2E_DB: Host=localhost;Port=5432;Database=bandvault_e2e;Username=bandvault_user;Password=SecretPassword123!
        run: dotnet test BandVault.E2E -c Release --no-build --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./BandVault.Web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bandvault-web:latest
            ghcr.io/${{ github.repository_owner }}/bandvault-web:${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy (C2)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL не задано - розгортання пропущено"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

      - name: Smoke test /health
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then exit 0; fi
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/health"; then exit 0; fi
            sleep 20
          done
          echo "::error::Застосунок не відповів на /health після розгортання"
          exit 1

  functions:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FUNC_NAME: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Functions (B7)
        run: dotnet publish BandVault.Functions -c Release -o functions-publish

      - name: Deploy to Azure Functions
        if: ${{ env.FUNC_NAME != '' }}
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: functions-publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
